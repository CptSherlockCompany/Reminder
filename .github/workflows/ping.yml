name: Alliance event pinger

on:
  schedule:
    # Every 5 minutes, the shortest interval GitHub accepts. It will not honour
    # most of these - scheduled runs on free public runners are routinely delayed
    # and frequently dropped - so the point is attempts, not precision. Twelve
    # chances an hour means a ping lands near its intended minute even when most
    # are skipped. state.json keeps the extra runs from repeating anything.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the payload instead of posting to Discord'
        type: boolean
        default: true
      now:
        description: 'Pretend it is this UTC time (YYYY-MM-DDTHH:MM), for testing'
        type: string
        default: ''
      preview_days:
        description: 'Instead of pinging, list occurrences for the next N days'
        type: string
        default: ''
      repost_summary:
        description: 'Post this week''s summary again, even if one is recorded'
        type: boolean
        default: false

concurrency:
  group: pinger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run tests
        run: node --test test/schedule.test.js

      # Phase 1 of 2. Works out what is due, records it in state.json and writes
      # the Discord payload to a file. Nothing is posted here.
      - name: Work out what is due
        id: plan
        run: |
          args=()
          if [ -n "${{ inputs.preview_days }}" ]; then
            args+=(--preview "${{ inputs.preview_days }}")
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          else
            args+=(--plan payload.json)
          fi
          if [ "${{ inputs.repost_summary }}" = "true" ]; then
            args+=(--force-summary)
          fi
          if [ -n "${{ inputs.now }}" ]; then
            args+=(--now "${{ inputs.now }}")
          fi
          node src/ping.js "${args[@]}"

      # The recording is committed BEFORE anything is announced. If this push is
      # rejected - branch protection, or read-only workflow permissions - the run
      # fails here having said nothing, and the next run simply tries again.
      # Announcing first and then failing to record would repeat the same ping on
      # every run until the grace window closed.
      - name: Record what is about to be announced
        if: hashFiles('payload.json') != ''
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            git commit -m 'Record announced events'
            git push
          fi

      # Phase 2 of 2. Only reached once the recording is durably pushed.
      - name: Announce
        if: hashFiles('payload.json') != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node src/ping.js --send payload.json

      # A posted summary's message id only exists once Discord has accepted it,
      # so it cannot be part of the commit above. Losing this write costs only a
      # stale summary left in the channel - never a duplicate post, because the
      # week was already claimed before anything was sent.
      - name: Record the summary's message id
        if: hashFiles('payload.json') != ''
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            git commit -m 'Record summary message id'
            git pull --rebase --autostash
            git push
          fi
